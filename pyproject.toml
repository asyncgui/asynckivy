[project]
name = "asynckivy"
version = "0.12.1"
description = "Async library for Kivy"
authors = [{ name = "Nattōsai Mitō", email = "flow4re2c@gmail.com" }]
license = "MIT"
readme = 'README.md'
requires-python = ">=3.11,<4.0"
keywords = ['async', 'kivy']
classifiers=[
    'Development Status :: 5 - Production/Stable',
    'Intended Audience :: Developers',
    'Programming Language :: Python',
    'Topic :: Software Development :: Libraries',
    'Operating System :: OS Independent',
]
dependencies = [
    "asyncgui>=0.11.1,<2",
]

[project.urls]
Documentation = "https://asyncgui.github.io/asynckivy/"
Repository = "https://github.com/asyncgui/asynckivy"

[dependency-groups]
dev = [
    "pytest>=9.0.3,<10",
    "kivy",
    "ruff>=0.16.9",
]
doc = [
    "sphinx>=7.0.0,<8",
    "sphinx-tabs>=3.4.1,<4",
    "furo>=2023.9.10,<2024",
]

[tool.uv]
default-groups = ["dev", ]

[tool.uv.sources]
kivy = { git = "https://github.com/kivy/kivy", rev = "c8e1f5f25802924e92f4f7f41851c9669778359e" }

[build-system]
requires = ["uv_build>=0.13.4,<0.14.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
xfail_strict = true
addopts = "--maxfail=4 --strict-markers"

[tool.ruff]
line-length = 119

[tool.ruff.lint]
ignore = [
    "B006", "B008",
    "E401", "E402", "I001",
    # "PLW0211",
    "PYI061",
    "RUF010", "RUF013", "RUF022",
    "SIM117",
    "UP007",  # Unionを用いないとsphinxでエラーが起きる
]
extend-select = [
    "E501", "Q000",
]

[tool.ruff.lint.per-file-ignores]
"tests/conftest.py" = ["F401"]
"tests/test_*.py" = ["E501"]
