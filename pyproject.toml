[project]
name = "asynckivy"
version = "0.11.1.dev0"
description = "Async library for Kivy"
authors = [{ name = "Nattōsai Mitō", email = "flow4re2c@gmail.com" }]
license = "MIT"
readme = 'README.md'
requires-python = ">=3.11,<4.0"
keywords = ['async', 'kivy']
classifiers=[
    'Development Status :: 5 - Production/Stable',
    'License :: OSI Approved :: MIT License',
    'Intended Audience :: Developers',
    'Programming Language :: Python',
    'Topic :: Software Development :: Libraries',
    'Operating System :: OS Independent',
]
dependencies = [
    "asyncgui>=0.11.1,<0.12",
]

[project.urls]
Documentation = "https://asyncgui.github.io/asynckivy/"
Repository = "https://github.com/asyncgui/asynckivy"

[dependency-groups]
dev = [
    "pytest>=9.0.3,<10",
    "flake8>=6.0.0,<7",
    "kivy",
]
doc = [
    "sphinx>=7.0.0,<8",
    "sphinx-tabs>=3.4.1,<4",
    "furo>=2023.9.10,<2024",
]
example = [
    "pillow>=12.3.0",
]

[tool.uv]
default-groups = ["dev", ]

[tool.uv.sources]
kivy = { git = "https://github.com/kivy/kivy", rev = "be90b9f4bdb28c734e1cc01d6e7a7e1440e5216e" }

[build-system]
requires = ["uv_build>=0.9.2,<0.12.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
xfail_strict = true
addopts = "--maxfail=4 --strict-markers"
